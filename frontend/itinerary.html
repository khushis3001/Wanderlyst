<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Your Itinerary | Wanderlyst</title>


    <!-- GOOGLE FONTS -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- FONT AWESOME -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================================
         NAVBAR
    ====================================================== -->

    <header class="topbar">


        <a
            href="dashboard.html"
            class="dashboard-logo"
        >

            <i class="fa-solid fa-compass"></i>

            Wanderlyst

        </a>


        <nav class="main-nav">

            <a href="dashboard.html">

                <i class="fa-solid fa-house"></i>

                Home

            </a>


            <a href="discover.html">

                <i class="fa-solid fa-compass"></i>

                Discover

            </a>


            <a href="trips.html">

                <i class="fa-solid fa-suitcase"></i>

                My Trips

            </a>

        </nav>


        <div class="nav-right">

            <a
                href="profile.html"
                class="profile-button"
            >

                <i class="fa-solid fa-user"></i>

            </a>


            <button
                id="logoutBtn"
                class="logout-btn"
                title="Logout"
            >

                <i class="fa-solid fa-right-from-bracket"></i>

            </button>

        </div>

    </header>



    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="plan-page">


        <div class="plan-container">


            <!-- =================================================
                 BACK BUTTON
            ================================================== -->

            <a
                href="trips.html"
                style="
                    display:inline-flex;
                    align-items:center;
                    gap:8px;
                    color:#806b5b;
                    font-size:12px;
                    margin-bottom:25px;
                "
            >

                <i class="fa-solid fa-arrow-left"></i>

                Back to My Trips

            </a>



            <!-- =================================================
                 TRIP HEADER
            ================================================== -->

            <section
                class="trip-form"
                style="margin-bottom:25px;"
            >


                <div
                    style="
                        display:flex;
                        align-items:center;
                        gap:20px;
                        position:relative;
                        z-index:2;
                    "
                >


                    <div class="plan-globe"
                         style="
                            margin:0;
                            width:65px;
                            height:65px;
                            flex-shrink:0;
                         "
                    >

                        <i class="fa-solid fa-location-dot"></i>

                    </div>


                    <div>

                        <p class="section-eyebrow">
                            YOUR JOURNEY
                        </p>


                        <h1
                            id="itineraryTripName"
                            style="
                                font-family:'DM Serif Display',serif;
                                font-size:38px;
                                font-weight:400;
                                color:#3b241d;
                            "
                        >
                            Your Trip
                        </h1>


                        <p
                            id="itineraryDestination"
                            style="
                                margin-top:5px;
                                color:#806b5b;
                                font-size:13px;
                            "
                        >
                            Destination
                        </p>

                    </div>

                </div>



                <!-- TRIP INFORMATION -->

                <div
                    style="
                        position:relative;
                        z-index:2;
                        display:flex;
                        flex-wrap:wrap;
                        gap:10px;
                        margin-top:28px;
                    "
                >


                    <span
                        style="
                            padding:8px 12px;
                            background:#f5e5ce;
                            border-radius:8px;
                            color:#56352a;
                            font-size:10px;
                        "
                    >

                        <i class="fa-regular fa-calendar"></i>

                        <span id="itineraryDates">
                            Dates
                        </span>

                    </span>


                    <span
                        style="
                            padding:8px 12px;
                            background:#f5e5ce;
                            border-radius:8px;
                            color:#56352a;
                            font-size:10px;
                        "
                    >

                        <i class="fa-solid fa-users"></i>

                        <span id="itineraryTravellers">
                            Travellers
                        </span>

                    </span>


                    <span
                        style="
                            padding:8px 12px;
                            background:#f5e5ce;
                            border-radius:8px;
                            color:#56352a;
                            font-size:10px;
                        "
                    >

                        <i class="fa-solid fa-compass"></i>

                        <span id="itineraryStyle">
                            Travel Style
                        </span>

                    </span>

                </div>



                <!-- DESCRIPTION -->

                <div
                    style="
                        position:relative;
                        z-index:2;
                        margin-top:22px;
                        padding-top:20px;
                        border-top:1px solid #ead7bf;
                    "
                >

                    <p
                        id="itineraryDescription"
                        style="
                            color:#806b5b;
                            font-size:12px;
                            line-height:1.8;
                        "
                    >
                        Your adventure awaits.
                    </p>

                </div>

            </section>



            <!-- =================================================
                 ITINERARY HEADING
            ================================================== -->

            <div
                style="
                    margin:35px 0 20px;
                "
            >

                <p class="section-eyebrow">
                    YOUR PLAN
                </p>


                <h2
                    style="
                        font-family:'DM Serif Display',serif;
                        font-size:35px;
                        font-weight:400;
                        color:#3b241d;
                    "
                >

                    Your Itinerary

                </h2>


                <p
                    style="
                        color:#806b5b;
                        font-size:12px;
                        margin-top:5px;
                    "
                >

                    A simple plan for your adventure.

                </p>

            </div>



            <!-- =================================================
                 GENERATED DAYS
            ================================================== -->

            <div id="itineraryDays"></div>



            <!-- =================================================
                 ACTIONS
            ================================================== -->

            <div
                style="
                    display:flex;
                    justify-content:center;
                    gap:12px;
                    margin-top:30px;
                    flex-wrap:wrap;
                "
            >


                <a
                    href="plan.html"
                    class="primary-button"
                >

                    <i class="fa-solid fa-plus"></i>

                    PLAN ANOTHER TRIP

                </a>


                <button
                    id="deleteTripBtn"
                    class="primary-button"
                    style="
                        border:none;
                        background:#fff0e9;
                        color:#a04d37;
                        cursor:pointer;
                    "
                >

                    <i class="fa-solid fa-trash"></i>

                    DELETE TRIP

                </button>

            </div>


        </div>

    </main>



    <!-- =====================================================
         TOAST
    ====================================================== -->

    <div id="toast"></div>



    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
