<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Profile | Wanderlyst</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- =====================================================
         NAVBAR
    ====================================================== -->

    <header class="topbar">


        <a
            href="dashboard.html"
            class="dashboard-logo"
        >

            <i class="fa-solid fa-compass"></i>

            Wanderlyst

        </a>


        <nav class="main-nav">

            <a href="dashboard.html">

                <i class="fa-solid fa-house"></i>

                Home

            </a>


            <a href="discover.html">

                <i class="fa-solid fa-compass"></i>

                Discover

            </a>


            <a href="trips.html">

                <i class="fa-solid fa-suitcase"></i>

                My Trips

            </a>

        </nav>


        <div class="nav-right">


            <a
                href="profile.html"
                class="profile-button active"
            >

                <i class="fa-solid fa-user"></i>

            </a>


            <button
                id="logoutBtn"
                class="logout-btn"
                title="Logout"
            >

                <i class="fa-solid fa-right-from-bracket"></i>

            </button>


        </div>

    </header>



    <!-- =====================================================
         PROFILE
    ====================================================== -->

    <main class="plan-page">


        <div
            class="plan-container"
            style="max-width:850px;"
        >


            <!-- HEADER -->

            <div
                style="
                    text-align:center;
                    margin-bottom:35px;
                "
            >

                <p class="section-eyebrow">

                    YOUR ACCOUNT

                </p>


                <h1
                    style="
                        font-family:'DM Serif Display',serif;
                        font-size:55px;
                        font-weight:400;
                        color:#3b241d;
                    "
                >

                    My Profile

                </h1>


                <p
                    style="
                        color:#806b5b;
                        font-size:13px;
                        margin-top:7px;
                    "
                >

                    Manage your Wanderlyst account.

                </p>

            </div>



            <!-- PROFILE CARD -->

            <section
                style="
                    background:rgba(255,255,255,.75);
                    border:1px solid #ddc3a1;
                    border-radius:20px;
                    padding:45px;
                    box-shadow:0 20px 50px rgba(76,48,32,.1);
                "
            >


                <!-- AVATAR -->

                <div
                    style="
                        display:flex;
                        justify-content:center;
                        margin-bottom:20px;
                    "
                >

                    <div
                        style="
                            width:100px;
                            height:100px;
                            border-radius:50%;
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            background:#56352a;
                            color:#f5cc92;
                            font-size:40px;
                            box-shadow:0 12px 30px rgba(86,53,42,.2);
                        "
                    >

                        <i class="fa-solid fa-user"></i>

                    </div>

                </div>



                <!-- EMAIL -->

                <div
                    style="
                        text-align:center;
                        margin-bottom:35px;
                    "
                >

                    <p
                        style="
                            font-size:10px;
                            letter-spacing:2px;
                            color:#927d6a;
                            text-transform:uppercase;
                        "
                    >

                        Signed in as

                    </p>


                    <h2
                        id="profileEmail"
                        style="
                            margin-top:6px;
                            font-family:'DM Serif Display',serif;
                            font-size:28px;
                            font-weight:400;
                            color:#3b241d;
                            word-break:break-word;
                        "
                    >

                        Loading...

                    </h2>

                </div>



                <!-- STATS -->

                <div
                    id="profileStats"
                    style="
                        display:grid;
                        grid-template-columns:repeat(3,1fr);
                        gap:15px;
                        margin-bottom:35px;
                    "
                >


                    <div
                        style="
                            padding:20px;
                            text-align:center;
                            border-radius:12px;
                            background:#fff9ef;
                            border:1px solid #ead7be;
                        "
                    >

                        <strong
                            id="profileTripCount"
                            style="
                                display:block;
                                font-family:'DM Serif Display',serif;
                                font-size:32px;
                                font-weight:400;
                                color:#56352a;
                            "
                        >

                            0

                        </strong>


                        <span
                            style="
                                font-size:10px;
                                color:#806b5b;
                            "
                        >

                            TRIPS

                        </span>

                    </div>



                    <div
                        style="
                            padding:20px;
                            text-align:center;
                            border-radius:12px;
                            background:#fff9ef;
                            border:1px solid #ead7be;
                        "
                    >

                        <strong
                            id="profileTravellerCount"
                            style="
                                display:block;
                                font-family:'DM Serif Display',serif;
                                font-size:32px;
                                font-weight:400;
                                color:#56352a;
                            "
                        >

                            0

                        </strong>


                        <span
                            style="
                                font-size:10px;
                                color:#806b5b;
                            "
                        >

                            TRAVELLERS

                        </span>

                    </div>



                    <div
                        style="
                            padding:20px;
                            text-align:center;
                            border-radius:12px;
                            background:#fff9ef;
                            border:1px solid #ead7be;
                        "
                    >

                        <strong
                            id="profileDestinationCount"
                            style="
                                display:block;
                                font-family:'DM Serif Display',serif;
                                font-size:32px;
                                font-weight:400;
                                color:#56352a;
                            "
                        >

                            0

                        </strong>


                        <span
                            style="
                                font-size:10px;
                                color:#806b5b;
                            "
                        >

                            DESTINATIONS

                        </span>

                    </div>


                </div>



                <!-- ACTIONS -->

                <div
                    style="
                        display:flex;
                        gap:12px;
                        flex-wrap:wrap;
                    "
                >


                    <a
                        href="plan.html"
                        class="primary-button"
                        style="flex:1;text-align:center;"
                    >

                        <i class="fa-solid fa-plus"></i>

                        PLAN A TRIP

                    </a>


                    <a
                        href="trips.html"
                        class="secondary-button"
                        style="flex:1;text-align:center;"
                    >

                        <i class="fa-solid fa-suitcase"></i>

                        MY TRIPS

                    </a>


                </div>


            </section>


        </div>

    </main>



    <div id="toast"></div>


    <script src="script.js"></script>


    <script>

        /*
         * Profile statistics
         */

        const profileTrips =
            JSON.parse(
                localStorage.getItem(
                    "wanderlystTrips"
                ) || "[]"
            );


        const tripCount =
            document.getElementById(
                "profileTripCount"
            );


        const travellerCount =
            document.getElementById(
                "profileTravellerCount"
            );


        const destinationCount =
            document.getElementById(
                "profileDestinationCount"
            );


        if (tripCount) {

            tripCount.textContent =
                profileTrips.length;

        }


        if (travellerCount) {

            const totalTravellers =
                profileTrips.reduce(
                    (
                        total,
                        trip
                    ) => {

                        return total +
                            Number(
                                trip.travellers || 0
                            );

                    },
                    0
                );


            travellerCount.textContent =
                totalTravellers;

        }


        if (destinationCount) {

            const uniqueDestinations =
                new Set(
                    profileTrips.map(
                        trip =>
                            trip.destination
                                ?.trim()
                                .toLowerCase()
                    )
                );


            destinationCount.textContent =
                uniqueDestinations.size;

        }

    </script>


</body>

</html>
