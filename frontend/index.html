<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wanderlyst | Travel Beyond Boundaries</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <main class="page">

        <!-- =========================
             HERO
        ========================== -->

        <section class="hero">

            <div class="hero-overlay"></div>

            <div class="hero-content">

                <div class="logo">
                    <i class="fa-solid fa-compass"></i>
                    <span>Wanderlyst</span>
                </div>

                <div class="tagline">
                    TRAVEL • DISCOVER • REMEMBER
                </div>


                <div class="hero-text">

                    <p class="eyebrow">
                        YOUR JOURNEY STARTS HERE
                    </p>

                    <h1>
                        The world<br>
                        is waiting.
                    </h1>

                    <p class="question">
                        Where will you <span>go next?</span>
                    </p>

                </div>


                <div class="route">

                    <div class="route-point">

                        <i class="fa-solid fa-location-dot"></i>

                        <span>YOU</span>

                    </div>

                    <div class="route-line"></div>

                    <i class="fa-solid fa-plane plane"></i>

                    <div class="route-line"></div>

                    <div class="route-point">

                        <i class="fa-solid fa-earth-americas"></i>

                        <span>WORLD</span>

                    </div>

                </div>


                <div class="travel-quote">

                    <i class="fa-solid fa-quote-left"></i>

                    <span>
                        Collect moments,<br>
                        not things.
                    </span>

                </div>

            </div>

        </section>


        <!-- =========================
             LOGIN
        ========================== -->

        <section class="login-area">

            <div class="login-card">

                <div class="globe">

                    <i class="fa-solid fa-earth-americas"></i>

                </div>


                <h2>
                    Welcome Back
                </h2>


                <p class="subtitle">
                    Sign in and continue your journey.
                </p>


                <form id="loginForm">

                    <!-- EMAIL -->

                    <div class="input-group">

                        <i class="fa-solid fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            placeholder="Email address"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->

                    <div class="input-group">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            placeholder="Password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            aria-label="Show password"
                        >
                            <i class="fa-solid fa-eye"></i>
                        </button>

                    </div>


                    <!-- OPTIONS -->

                    <div class="form-options">

                        <label class="remember">

                            <input
                                type="checkbox"
                                id="rememberMe"
                            >

                            <span>
                                Remember me
                            </span>

                        </label>


                        <a href="#" id="forgotPassword">
                            Forgot password?
                        </a>

                    </div>


                    <!-- LOGIN BUTTON -->

                    <button
                        type="submit"
                        class="login-button"
                    >

                        LOGIN

                        <i class="fa-solid fa-arrow-right"></i>

                    </button>

                </form>


                <!-- DIVIDER -->

                <div class="divider">

                    <span></span>

                    <p>
                        or continue with
                    </p>

                    <span></span>

                </div>


                <!-- SOCIAL -->

                <div class="social-buttons">

                    <button
                        type="button"
                        title="Google"
                        data-social="Google"
                    >
                        <i class="fa-brands fa-google"></i>
                    </button>


                    <button
                        type="button"
                        title="GitHub"
                        data-social="GitHub"
                    >
                        <i class="fa-brands fa-github"></i>
                    </button>


                    <button
                        type="button"
                        title="Apple"
                        data-social="Apple"
                    >
                        <i class="fa-brands fa-apple"></i>
                    </button>

                </div>


                <!-- SIGNUP -->

                <p class="signup-text">

                    New to Wanderlyst?

                    <a href="signup.html">
                        Create an account
                    </a>

                </p>

            </div>

        </section>

    </main>


    <div id="toast"></div>


    <script src="script.js"></script>

</body>

</html>
